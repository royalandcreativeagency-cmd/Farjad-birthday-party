<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>You’re invited: Farjad’s Spider Birthday Party</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070d;--bg2:#1a0a12;--red:#e61e32;--blue:#2447ff;--web:#e9ecff;--ink:#07070d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 65%) fixed;color:var(--web);font:400 18px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
canvas#c{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.web{position:fixed;width:min(60vw,380px);height:auto;color:var(--web);opacity:.22;pointer-events:none;z-index:1}
.web.tl{top:0;left:0}.web.br{bottom:0;right:0;transform:rotate(180deg)}
svg.sp{display:block;overflow:visible}
.drop{position:absolute;left:50%;top:0;z-index:3;display:flex;flex-direction:column;align-items:center;transform:translateX(-50%);pointer-events:none}
.thread{width:2px;background:var(--web);height:0;animation:lower 2.4s cubic-bezier(.4,.1,.3,1) .3s forwards}
.drop .sp{animation:sway 3s ease-in-out 2.7s infinite;transform-origin:50% 0}
@keyframes lower{to{height:clamp(120px,24vh,220px)}}
@keyframes sway{50%{transform:rotate(7deg)}}
.crawl{position:fixed;bottom:12px;left:-60px;z-index:2;color:var(--red);animation:walk 22s linear infinite;pointer-events:none}
.crawl.two{animation-duration:34s;animation-delay:-14s;bottom:44px;color:var(--blue);transform:scale(.7)}
@keyframes walk{to{transform:translateX(calc(100vw + 120px))}}
.crawl.two{animation-name:walk2}
@keyframes walk2{to{transform:translateX(calc(100vw + 120px)) scale(.7)}}
main{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:0 22px}
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:210px 0 40px}
.sub{margin:0;font-size:clamp(20px,4vw,28px);color:var(--web);opacity:0;animation:fade 1s 2.4s forwards}
h1{font-family:Anton,Impact,"Arial Narrow Bold",sans-serif;font-weight:400;margin:6px 0 0;line-height:.92;font-size:clamp(76px,22vw,230px);letter-spacing:.02em;color:var(--red);text-shadow:5px 5px 0 var(--blue),0 0 40px rgba(230,30,50,.45)}
h1 span{display:inline-block;opacity:0;transform:translateY(-60px) scaleY(1.5);animation:snap .5s cubic-bezier(.2,1.4,.4,1) forwards}
h1 span:nth-child(1){animation-delay:2.5s}h1 span:nth-child(2){animation-delay:2.6s}h1 span:nth-child(3){animation-delay:2.7s}
h1 span:nth-child(4){animation-delay:2.8s}h1 span:nth-child(5){animation-delay:2.9s}h1 span:nth-child(6){animation-delay:3s}
@keyframes snap{to{opacity:1;transform:none}}
.hero h2{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.06em;font-size:clamp(30px,6vw,56px);margin:14px 0 0;opacity:0;animation:fade 1s 3.3s forwards}
.lead{max-width:32ch;margin:14px 0 28px;opacity:0;animation:fade 1s 3.5s forwards}
@keyframes fade{to{opacity:1}}
.btn{font:600 18px "DM Sans",sans-serif;border:0;border-radius:999px;padding:16px 34px;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 6px 0 #8f0f1d;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #8f0f1d}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
.details{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;padding:30px 0 60px}
.t{position:relative;background:#101019;border:2px solid var(--red);padding:34px 24px;text-align:center;clip-path:polygon(0 12px,12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%)}
.t:nth-child(2){border-color:var(--blue)}
.t h3{margin:0;font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.04em;font-size:46px;line-height:1.1}
.t p{margin:6px 0 0;opacity:.85}
.count,.rsvp{text-align:center}
.count{padding:20px 0 70px}
h2.big{font-family:Anton,Impact,sans-serif;font-weight:400;letter-spacing:.05em;font-size:clamp(32px,6vw,52px);margin:0 0 22px}
.cd{display:flex;justify-content:center;gap:clamp(10px,3vw,22px);flex-wrap:wrap}
.cd div{min-width:88px;padding:16px 10px;border:2px solid var(--web);border-radius:50% 50% 50% 50%/60% 60% 40% 40%}
.cd b{display:block;font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(38px,9vw,64px);line-height:1;color:var(--red)}
.cd small{font-size:15px}
.rsvp{padding:10px 0 110px}
#ok{min-height:2.2em;margin-top:20px;font-size:22px;color:#8fa2ff;font-weight:600}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}.crawl{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="spider" viewBox="-50 -30 100 70">
<g stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M-8 -4 L-28 -22 L-44 -10"/><path d="M-9 0 L-34 -4 L-48 10"/><path d="M-9 4 L-30 14 L-42 32"/><path d="M-6 8 L-16 24 L-22 38"/>
<path d="M8 -4 L28 -22 L44 -10"/><path d="M9 0 L34 -4 L48 10"/><path d="M9 4 L30 14 L42 32"/><path d="M6 8 L16 24 L22 38"/>
</g>
<ellipse cx="0" cy="12" rx="13" ry="17" fill="currentColor"/>
<circle cx="0" cy="-6" r="8" fill="currentColor"/>
<circle cx="-3" cy="-8" r="1.8" fill="#fff"/><circle cx="3" cy="-8" r="1.8" fill="#fff"/>
</symbol>
<symbol id="webs" viewBox="0 0 200 200">
<g stroke="currentColor" stroke-width="1.2" fill="none">
<path d="M0 0 L200 0 M0 0 L190 70 M0 0 L150 150 M0 0 L70 190 M0 0 L0 200"/>
<path d="M40 0 Q30 30 0 40 M80 0 Q62 62 0 80 M120 0 Q95 95 0 120 M160 0 Q128 128 0 160"/>
</g></symbol>
</defs></svg>

<svg class="web tl" aria-hidden="true"><use href="#webs" width="100%" height="100%"/></svg>
<svg class="web br" aria-hidden="true"><use href="#webs" width="100%" height="100%"/></svg>
<canvas id="c" aria-hidden="true"></canvas>
<div class="drop" aria-hidden="true"><div class="thread"></div><svg class="sp" width="96" height="68" style="color:var(--red)"><use href="#spider" width="96" height="68"/></svg></div>
<svg class="sp crawl" width="64" height="46" aria-hidden="true"><use href="#spider" width="64" height="46"/></svg>
<svg class="sp crawl two" width="64" height="46" aria-hidden="true"><use href="#spider" width="64" height="46"/></svg>

<main>
<section class="hero">
<p class="sub">You are invited to</p>
<h1 aria-label="Farjad"><span>F</span><span>A</span><span>R</span><span>J</span><span>A</span><span>D</span></h1>
<h2>BIRTHDAY PARTY</h2>
<p class="lead">Swing in for cake, music and a night of spider-sized fun.</p>
<button class="btn" id="pop">Shoot the webs</button>
</section>

<section class="details" aria-label="Party details">
<div class="t"><h3>Sunday</h3><p>27 December</p></div>
<div class="t"><h3>5:00 PM</h3><p>Please arrive on time</p></div>
<div class="t"><h3>At Home</h3><p>Doors open for you</p></div>
</section>

<section class="count">
<h2 class="big">The party starts in</h2>
<div class="cd" role="timer" aria-live="off">
<div><b id="d">0</b><small>days</small></div>
<div><b id="h">0</b><small>hours</small></div>
<div><b id="m">0</b><small>minutes</small></div>
<div><b id="s">0</b><small>seconds</small></div>
</div>
</section>

<section class="rsvp">
<h2 class="big">Will you be there?</h2>
<p>Tap below to let Farjad know.</p>
<button class="btn" id="yes">Yes, I’m coming</button>
<div id="ok" role="status"></div>
</section>
</main>

<script>
(function(){
var cols=["#e61e32","#2447ff","#e9ecff","#e9ecff","#ff5a6a"];
var cv=document.getElementById("c"),x=cv.getContext("2d"),P=[],W,H,run=false;
function size(){var r=window.devicePixelRatio||1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r}
size();addEventListener("resize",size);
// web strands shoot out from a point, then flutter down as shreds
function burst(cx,cy,n){var r=window.devicePixelRatio||1;
for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=(4+Math.random()*10)*r;
P.push({x:cx*r,y:cy*r,vx:Math.cos(a)*v,vy:Math.sin(a)*v-5*r,l:(8+Math.random()*14)*r,rot:a,vr:Math.random()*.3-.15,c:cols[i%cols.length],life:1})}
if(!run){run=true;requestAnimationFrame(tick)}}
function tick(){x.clearRect(0,0,W,H);var r=window.devicePixelRatio||1;
P=P.filter(function(p){return p.life>0&&p.y<H+40});
P.forEach(function(p){p.vy+=.22*r;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.0035;
x.save();x.globalAlpha=Math.max(p.life,0);x.translate(p.x,p.y);x.rotate(p.rot);x.strokeStyle=p.c;x.lineWidth=2*r;
x.beginPath();x.moveTo(-p.l/2,0);x.lineTo(p.l/2,0);x.stroke();x.restore()});
if(P.length)requestAnimationFrame(tick);else run=false}
var still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function pop(cx,cy,n){if(!still)burst(cx,cy,n)}
setTimeout(function(){pop(innerWidth/2,innerHeight*.45,140)},2700);
document.getElementById("pop").addEventListener("click",function(){
pop(innerWidth*.2,innerHeight*.6,90);pop(innerWidth*.8,innerHeight*.6,90);pop(innerWidth/2,innerHeight*.4,90)});
document.getElementById("yes").addEventListener("click",function(e){
var r=e.target.getBoundingClientRect();pop(r.left+r.width/2,r.top,160);
document.getElementById("ok").textContent="See you on Sunday, 27 December at 5:00 PM!"});
var T=new Date(2026,11,27,17,0,0).getTime();
function upd(){var t=Math.max(0,T-Date.now()),s=Math.floor(t/1000);
document.getElementById("d").textContent=Math.floor(s/86400);
document.getElementById("h").textContent=Math.floor(s%86400/3600);
document.getElementById("m").textContent=Math.floor(s%3600/60);
document.getElementById("s").textContent=s%60}
upd();setInterval(upd,1000);
})();
</script>
</body>
</html>
